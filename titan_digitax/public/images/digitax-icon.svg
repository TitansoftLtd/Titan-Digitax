<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Digitax brand green -->
  <rect width="64" height="64" rx="12" fill="#21D850"/>
  <!-- Pixel "d" (black), 8x8 grid unit = 4 -->
  <!-- stem (top) -->
  <rect x="36" y="12" width="12" height="8" fill="#000000"/>
  <!-- upper bowl + stem -->
  <rect x="28" y="20" width="20" height="8" fill="#000000"/>
  <!-- middle: left of hole + stem -->
  <rect x="20" y="28" width="12" height="8" fill="#000000"/>
  <rect x="36" y="28" width="12" height="8" fill="#000000"/>
  <!-- lower bowl + stem -->
  <rect x="28" y="36" width="20" height="8" fill="#000000"/>
  <!-- stem bottom extension -->
  <rect x="36" y="44" width="12" height="8" fill="#000000"/>
</svg>
